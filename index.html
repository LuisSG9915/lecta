<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8f1e3" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1f2022" />
    <meta name="description" content="Lecta: tu libro y tu cuaderno. Lee EPUB, toca palabras y repásalas cuando toque." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Lecta" />
    <title>Lecta — tu cuaderno de lectura</title>
    <style id="lecta-critical-css">
      :root {
        --paper: #FBF7F0;
        --ink: #2C2825;
        --bg: var(--paper);
        background-color: var(--paper);
        color: var(--ink);
      }
      [data-theme="white"] {
        --paper: #FFFFFF;
        --ink: #1C1B1A;
        --bg: var(--paper);
        background-color: var(--paper);
        color: var(--ink);
      }
      [data-theme="night"] {
        --paper: #141619;
        --ink: #EAE6DF;
        --bg: var(--paper);
        background-color: var(--paper);
        color: var(--ink);
      }
      [data-theme="oled"] {
        --paper: #000000;
        --ink: #EAE6DF;
        --bg: var(--paper);
        background-color: var(--paper);
        color: var(--ink);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="paper"]):not([data-theme="white"]) {
          --paper: #141619;
          --ink: #EAE6DF;
          --bg: var(--paper);
          background-color: var(--paper);
          color: var(--ink);
        }
      }
      body {
        margin: 0;
        background-color: var(--paper);
        color: var(--ink);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, serif;
      }
      .visually-hidden,
      .sr-only,
      input[type="file"].visually-hidden {
        position: absolute !important;
        width: 1px !important;
        height: 1px !important;
        padding: 0 !important;
        margin: -1px !important;
        overflow: hidden !important;
        clip: rect(0, 0, 0, 0) !important;
        white-space: nowrap !important;
        border: 0 !important;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
